<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Tree Lights QR Code</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; padding: 16px;
    font-family: system-ui, sans-serif; background: #070b16; color: #fff; text-align: center;
  }
  #qr { background: #fff; padding: 20px; border-radius: 12px; }
  a { color: #ffe14d; word-break: break-all; }
</style>
</head>
<body>
  <h1>🎄 Scan to play on your phone</h1>
  <div id="qr"></div>
  <p><a href="https://twymanfamily.github.io/christmas-tree-lights/">twymanfamily.github.io/christmas-tree-lights</a></p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qr"), {
      text: "https://twymanfamily.github.io/christmas-tree-lights/",
      width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
